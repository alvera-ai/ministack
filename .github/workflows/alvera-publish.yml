# Publishes this fork's image to the Alvera org's container registry.
#
# Upstream's own docker-publish.yml hardcodes ministackorg's Docker Hub and
# GHCR names, so it cannot serve a fork — it would push where we have no
# rights. This is the fork's equivalent, and it exists for one reason: the
# platform rig needs the SNS SMS message log that upstream PR #1682 adds, and
# waiting for that to merge would leave two integration-test assertions dark.
#
# Same shape as the org's other two fork-built images,
# ghcr.io/alvera-ai/alvera-watchman and ghcr.io/alvera-ai/otlp2parquet.
#
# When #1682 merges, this fork and this workflow stop being needed: point
# local-dependencies.yml back at ministackorg's published image and delete the
# alvera branch.
name: Publish Alvera image

on:
  push:
    branches: [alvera]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/alvera-ai/ministack

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the upstream version this fork is built from
        id: v
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags, both meaningful: the exact build for local-dependencies.yml
      # to pin, and a moving `alvera` for anything that wants the head of this
      # branch. The rig pins the first — an unpinned tag is how otlp2parquet
      # once served a different, older binary than the one under test.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Both, not just the runner's. Omitting this publishes amd64 only,
          # and every developer machine here is arm64 — the pull fails with
          # "no matching manifest", which reads like a missing tag.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}-sns-log
            ${{ env.IMAGE }}:alvera
          cache-from: type=gha
          cache-to: type=gha,mode=max
